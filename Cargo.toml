[package]
name = "forge-runner"
version = "1.2.0"
edition = "2024"
rust-version = "1.91"
authors = ["0xReLogic"]
description = "Fast, Offline, Reliable, Go-anywhere Execution - A lightweight local CI/CD runner built with Rust"
license = "MIT"
repository = "https://github.com/0xReLogic/Forge"
homepage = "https://github.com/0xReLogic/Forge"
documentation = "https://github.com/0xReLogic/Forge/tree/main/docs"
readme = "README.md"
keywords = ["ci", "cd", "cicd", "docker", "automation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34+deprecated"
tokio = { version = "1.52.3", features = ["full"] }
bollard = "0.21.0"
uuid = { version = "1.23.3", features = ["v4"] }
futures-util = "0.3.32"
colored = "3.1.1"
indicatif = "0.18.4"
dotenvy = "0.15.7"
ratatui = "0.30.1"
crossterm = "0.29.0"
chrono = { version = "0.4.41", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
criterion = "0.8.2"

[[bench]]
name = "parallel_benchmark"
harness = false
