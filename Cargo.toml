[package]
name = "forge"
version = "1.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34+deprecated"
tokio = { version = "1.52.3", features = ["full"] }
bollard = "0.21.0"
uuid = { version = "1.23.3", features = ["v4"] }
futures-util = "0.3.32"
colored = "3.1.1"
indicatif = "0.18.4"
dotenvy = "0.15.7"
ratatui = "0.30.1"
crossterm = "0.29.0"

[dev-dependencies]
tempfile = "3.27.0"
criterion = "0.8.2"

[[bench]]
name = "parallel_benchmark"
harness = false
